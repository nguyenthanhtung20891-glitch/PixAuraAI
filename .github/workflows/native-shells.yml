name: Native application shells
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0, Node 24
      - run: node --test tests/foundation.test.mjs tests/ci-tools.test.mjs tests/shells.test.mjs
      - run: bash -n scripts/check-apple.sh scripts/check-ios-shell.sh scripts/check-sanitizers.sh
  android-app:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0, Node 24
        with:
          distribution: temurin
          java-version: 21.0.10
      - name: Install pinned SDK inputs
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.22.1" "system-images;android-35;google_apis;x86_64"
      - name: Build debug, unsigned release, JVM tests, lint and instrumentation APK
        working-directory: platforms/android
        run: bash gradlew --no-daemon --dependency-verification strict assembleDebug assembleRelease testDebugUnitTest lintDebug lintRelease assembleDebugAndroidTest
      - name: Execute JNI and Compose smoke tests on Android emulator
        working-directory: platforms/android
        run: |
          sudo chmod a+rw /dev/kvm
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force --name pixaura-shell --package "system-images;android-35;google_apis;x86_64"
          "$ANDROID_HOME/emulator/emulator" -avd pixaura-shell -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > ../../build-android-emulator.log 2>&1 &
          emulator_pid=$!
          trap 'kill "$emulator_pid" || true' EXIT
          timeout 180 "$ANDROID_HOME/platform-tools/adb" wait-for-device
          for _ in $(seq 1 120); do
            if [ "$("$ANDROID_HOME/platform-tools/adb" shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then break; fi
            sleep 2
          done
          test "$("$ANDROID_HOME/platform-tools/adb" shell getprop sys.boot_completed | tr -d '\r')" = 1
          "$ANDROID_HOME/platform-tools/adb" shell input keyevent 82
          bash gradlew --no-daemon --dependency-verification strict connectedDebugAndroidTest
      - name: Preserve Android evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0, Node 24
        with:
          name: android-shell-evidence
          path: |
            platforms/android/app/build/reports/
            platforms/android/app/build/outputs/androidTest-results/
            build-android-emulator.log
          retention-days: 14
  ios-app:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - name: Preserve Phase 0 Apple package and C ABI gates
        run: bash scripts/check-apple.sh
      - name: Build debug/release iOS app and execute Swift/C ABI and UI tests
        run: bash scripts/check-ios-shell.sh
      - name: Preserve Apple evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ios-shell-evidence
          path: |
            build/ios-shell-results.*/
            build/apple-results.*/
            build/apple-host/Testing/
            build/ios-shell-devices.json
          retention-days: 14

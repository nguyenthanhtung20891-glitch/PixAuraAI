name: Native application shells
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0, Node 24
      - run: node --test tests/foundation.test.mjs tests/ci-tools.test.mjs tests/shells.test.mjs tests/android-emulator.test.mjs tests/document-contract.test.mjs tests/native-document.test.mjs tests/persistence.test.mjs tests/decode.test.mjs tests/working.test.mjs tests/evaluation.test.mjs tests/geometry.test.mjs tests/geometry-execution.test.mjs tests/preview.test.mjs tests/gpu.test.mjs tests/manual-tools.test.mjs tests/manual-geometry.test.mjs tests/tone-color.test.mjs tests/detail-tools.test.mjs tests/presets.test.mjs
      - run: bash -n scripts/check-metal-shaders.sh scripts/check-gpu-apple-hardware.sh scripts/check-apple.sh scripts/check-ios-shell.sh scripts/check-sanitizers.sh scripts/check-android-emulator.sh
  android-app:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0, Node 24
        with:
          distribution: temurin
          java-version: 21.0.10
      - name: Install pinned SDK inputs
        run: bash scripts/install-android-sdk.sh
      - name: Build debug, unsigned release, JVM tests, lint and instrumentation APK
        working-directory: platforms/android
        run: bash gradlew --no-daemon --dependency-verification strict assembleDebug assembleRelease testDebugUnitTest lintDebug lintRelease assembleDebugAndroidTest
      - name: Execute JNI and Compose smoke tests on Android emulator
        # Script verifies factory-empty ext4 and emulator-resolved hardware before VM launch.
        timeout-minutes: 35
        run: bash scripts/check-android-emulator.sh
      - name: Preserve Android evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0, Node 24
        with:
          name: android-shell-evidence
          path: |
            platforms/android/app/build/reports/
            platforms/android/app/build/outputs/androidTest-results/
            build/android-emulator-evidence/
          retention-days: 14
  ios-app:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - name: Preserve Phase 0 Apple package and C ABI gates
        run: bash scripts/check-apple.sh
      - name: Build debug/release iOS app and execute Swift/C ABI and UI tests
        run: bash scripts/check-ios-shell.sh
      - name: Preserve Apple evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ios-shell-evidence
          path: |
            build/ios-shell-results.*/
            build/apple-results.*/
            build/apple-host/Testing/
            build/apple-host/document-canonical.json
            build/ios-shell-devices.json
          retention-days: 14
